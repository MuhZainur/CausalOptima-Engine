[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "causaloptima-engine"
version = "0.1.0"
description = "Algorithmic Causal AI & Uplift Decision Platform with EconML and DoWhy"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Zainur" }
]
dependencies = [
    "econml>=0.15.0",
    "dowhy>=0.11.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "polars>=0.20.0",
    "pyarrow>=16.0.0",
    "networkx>=3.2.0",
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
